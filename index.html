<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Pedidos</title>
    <link rel="stylesheet" href="src/styles/global.css">
</head>

<body>
    <header>
        <h1>Gerenciamento de Pedidos</h1>
        <nav class="nav-menu">
            <button class="btn-new-register">Novo Cadastro</button>
            <button class="btn-orders">Pedidos</button>
            <input type="text" name="seach" id="inp-seach" placeholder=" Procurar pedido">
            <button class="btn-seach">Procurar</button>
        </nav>
    </header>
    <nav class="nav-filter">
        <label for="filter">Filtrar:</label>
        <select name="filter" id="filter">
            <option value="all" class="filter-option">Todos</option>
            <option value="pending" class="filter-option">Pendente</option>
            <option value="paid" class="filter-option">Pago</option>
            <option value="sent" class="filter-option">Enviado</option>
            <option value="canceled" class="filter-option">Cancelado</option>
        </select>
    </nav>

    <main class="container">

        <section class="resume">
            <h2>Estatísticas </h2>
            <p class="total-orders"></p>
        </section>

        <section class="register-order">

            <form action="#" id="register" method="get">
                <p class="order-number"><strong>Pedido:</strong> #0001</p>
                <label for="inp-name">Nome do Cliente:</label>
                <input type="text" name="inp-name" id="inp-name"> <br>

                <label for="inp-product">Produto</label>
                <input type="text" name="inp-product" id="inp-product"> <br>

                <label for="inp-category">Categoria:</label>
                <input type="text" name="inp-category" id="inp-category"> <br>

                <label for="inp-qnt">Quantidade:</label>
                <input type="number" name="inp-qnt" id="inp-qnt"> <br>

                <label for="inp-price">Preço Unitário:</label>
                <input type="text" name="inp-price" id="inp-price"> <br>

                <label for="inp-status">Status:</label>
                <select name="inp-status" id="inp-status">
                    <option value="Pendente">Pendente</option>
                    <option value="Pago">Pago</option>
                    <option value="Enviado">Enviado</option>
                    <option value="Cancelado">Cancelado</option>
                </select> <br>

                <button class="btn-register">Cadastrar</button>
                <p class="msg"></p>

            </form>
        </section>

        <section class="orders-list">
            <h2>Todos os pedidos</h2>
        </section>

        <section class="filter-area">
            <h2 class="title-filter">Pedidos filtrados</h2>
        </section>
        
        <footer>
            <p>Desenvolvido por Jonathan C.</p>
        </footer>
    </main>

    <script src="src/scripts/javascript/script.js"></script>
</body>

</html>
