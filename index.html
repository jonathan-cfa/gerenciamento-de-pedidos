<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Pedidos</title>
    <link rel="stylesheet" href="src/styles/global.css">
</head>

<body>
    <header>
        <h1>Gerenciamento de Pedidos</h1>
        <nav class="nav-menu">
            <button class="btn-new-register">Novo Cadastro</button> <button class="btn-orders">Pedidos</button>
            <input type="text" name="seach" id="inp-seach"> <button class="btn-seach">Procurar</button>
        </nav>
    </header>
    <nav class="nav-filter">
        <button class="btn-all">Todos</button> <button class="btn-pending">Pendentes</button>
        <button class="btn-paid">Pagos</button> <button class="btn-sent">Enviados</button>
        <button class="btn-canceled">Cancelados</button>

    </nav>

    <main class="container">
        <section class="resume">
            <h2>Estatísticas </h2>
            <p>Total de Pedidos: 0</p>
            <p>Pedidos Pagos: 0</p>
            <p>Pedidos Enviados: 0</p>
            <p>Pedidos Cancelados: 0</p>
            <hr>
            <h3>Financeiro</h3>
            <p>Valor total em pedidos: R$00,00</p>
            <p>Valor total Recebido: R$0,00</p>
            <p>Valor total Cancelados: R$00,00</p>
        </section>

        <section class="register-order">

            <form action="#" id="register" method="get">
                <p class="order-number"><strong>Pedido:</strong> #0001</p>
                <label for="inp-name">Nome do Cliente:</label>
                <input type="text" name="inp-name" id="inp-name"> <br>

                <label for="inp-product">Produto</label>
                <input type="text" name="inp-product" id="inp-product"> <br>

                <label for="inp-category">Categoria:</label>
                <input type="text" name="inp-category" id="inp-category"> <br>

                <label for="inp-qnt">Quantidade:</label>
                <input type="number" name="inp-qnt" id="inp-qnt"> <br>

                <label for="inp-price">Preço Unitário:</label>
                <input type="text" name="inp-price" id="inp-price"> <br>

                <label for="inp-status">Status:</label>
                <select name="inp-status" id="inp-status">
                    <option value="Pendente">Pendente</option>
                    <option value="Pago">Pago</option>
                    <option value="Enviado">Enviado</option>
                    <option value="Cancelado">Cancelado</option>
                </select> <br>

                <button class="btn-register">Cadastrar</button>

            </form>
        </section>

        <section class="orders-list">
            <h2>Todos os pedidos</h2>
        </section>
        <footer>
            <p>Desenvolvido por Jonathan C.</p>
        </footer>
    </main>

    <script src="src/scripts/javascript/script.js"></script>
</body>

</html>
